# Publica o app no GitHub Pages a cada push na branch main.
# Pré-requisito (uma vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do motor
        run: node tests/engine.test.mjs
      - name: Montar site (lista offline + pasta www)
        run: node tools/build-web.mjs --www
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
